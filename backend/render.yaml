services:
  - type: web
    name: couriertrack-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: >-
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      python manage.py create_admin &&
      python manage.py load_sample_data &&
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DB_ENGINE
        value: postgresql
      - key: CORS_ALLOWED_ORIGINS
        value: "https://frontend-virid-eta-qbm19vrciu.vercel.app,http://localhost:5173"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://frontend-virid-eta-qbm19vrciu.vercel.app,http://localhost:5173"
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@couriertrack.com
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: couriertrack-db
          property: connectionString

databases:
  - name: couriertrack-db
    plan: free
    databaseName: couriertrack
    user: couriertrack
