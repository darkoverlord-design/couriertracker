services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-courier_db}
      POSTGRES_USER: ${DB_USER:-courier_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-courier_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-courier_user} -d ${DB_NAME:-courier_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DEBUG: ${DEBUG:-False}
      LOAD_SAMPLE_DATA: ${LOAD_SAMPLE_DATA:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
